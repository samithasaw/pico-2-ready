name: Build Pico 2 Firmware

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Dependencies & ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential python3

      - name: Setup Pico SDK
        run: |
          git clone --recursive --branch 2.0.0 https://github.com/raspberrypi/pico-sdk.git $GITHUB_WORKSPACE/pico-sdk
          echo "PICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk" >> $GITHUB_ENV

      - name: Configure CMake for Pico 2 (RP2350)
        run: |
          mkdir build
          cd build
          cmake -DPICO_BOARD=pico2 -DPICO_PLATFORM=rp2350 ..

      - name: Build Firmware
        run: |
          cd build
          make -j$(nproc)

      - name: Upload Build Artifacts (.uf2 and .elf)
        uses: actions/upload-artifact@v4
        with:
          name: Pico2-DFU-Firmware
          path: |
            build/*.uf2
            build/*.elf
            build/*.bin
